services:
  sam:
    build: .
    container_name: sam
    restart: unless-stopped
    env_file: .env
    volumes:
      # Sam's persistent state
      - ./data:/data
      # Sam logs in to Claude Code inside the container.
      # Bind-mounted to ./.claude so you can inspect the contents from the host.
      - ./.claude:/home/sam/.claude
    environment:
      - TZ=${TZ}
