services:
  sam:
    build: .
    container_name: sam
    restart: unless-stopped
    env_file: .env
    volumes:
      # Sam's persistent state
      - ./data:/data
      # Vertex AI ADC (Application Default Credentials).
      # Created on the host by `gcloud auth application-default login`.
      # Read-only mount — Sam never writes auth back.
      - ~/.config/gcloud:/home/sam/.config/gcloud:ro
    environment:
      - TZ=${TZ}
