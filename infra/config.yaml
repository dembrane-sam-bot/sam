# Sam deployment config — single source of truth for all non-secret values.
#
# Both Terraform (infra/*.tf) and the CI workflow (.github/workflows/ci-deploy.yml)
# read this file. Edit a value here → both pick it up on the next apply / deploy.
#
# Secret values (Slack tokens, GitHub PAT, Linear API key) live ONLY in GCP
# Secret Manager — never in this repo. Populate them once via:
#   bash infra/scripts/upload-secrets.sh

# ── GCP project + regions ──────────────────────────────────────────────────
gcp_project_id: dembrane-sameer-cli
gcp_region: europe-west1     # Cloud Run + Artifact Registry — Sam the service runs in EU
vertex_location: eu          # Sets GOOGLE_CLOUD_LOCATION on Cloud Run. NOT read by Gemini agents
                             # (adk_runner.py pins per-agent location explicitly via
                             # SAM_MAIN_VERTEX_LOCATION / SAM_WORKER_VERTEX_LOCATION).
                             # Only the dormant Claude path reads this env var. Keep "eu"
                             # so re-enabling Claude works without flipping anything else.

# ── Slack identity  ────────────────────────────────
slack_channel: C0B2VBYU79V
slack_operator_user_id: U06G1DC1UMQ

# ── Runtime ────────────────────────────────────────────────────────────────
timezone: Europe/Amsterdam

# ── GitHub repo allowed to deploy via WIF ──────────────────────────────────
github_repo: Dembrane/sam
# Numeric owner ID pins WIF to *this specific org account*. If the Dembrane
# org were ever deleted, the name could be re-registered by anyone — but the
# numeric ID can never be reissued. Fetch with: gh api orgs/<org> --jq .id
github_owner_id: "157605218"

# ── Bot identity ───────────────────────────────────────────────────────────
# Identity for Sam's git commits inside the container. The deploy workflow
# threads these through Cloud Run's --set-env-vars as `GIT_AUTHOR_*` and
# `GIT_COMMITTER_*`, which git reads in preference to gitconfig. So every
# `git commit` in the container attributes to the bot without the daemon
# needing to touch gitconfig.
#
# The email must match a verified email on the bot's GitHub account for
# commits to link there; `sameer+bot@dembrane.com` is an alias of the
# operator's primary mailbox (RFC 5233 plus-addressing) so the bot doesn't
# need its own inbox.
#
# HTTPS push credentials are wired separately via `gh auth setup-git` in
# the daemon's startup — see `src/runtime/daemon.py::_setup_git_identity`.
bot_identity:
  name: Sam
  email: sameer+bot@dembrane.com

# ── Cloud Run instance settings ────────────────────────────────────────────
# Sam is single-instance by design (one daemon, one lock). Don't scale out.
cloud_run:
  min_instances: 1
  max_instances: 1
  memory: 2Gi
  cpu: "2"
  sam_home: /data

# ── Secrets ────────────────────────────────────────────────────────────────
# Mapping: <env var name Sam reads at runtime> → <secret ID in GCP Secret Manager>
# TF creates these secret resources. Values are populated by upload-secrets.sh.
# GITHUB_TOKEN is renamed to SAM_GITHUB_TOKEN in Secret Manager to avoid clashing
# with the auto-injected GITHUB_TOKEN GitHub Actions provides.
secrets:
  SLACK_APP_TOKEN: SLACK_APP_TOKEN
  SLACK_BOT_TOKEN: SLACK_BOT_TOKEN
  SLACK_SIGNING_SECRET: SLACK_SIGNING_SECRET
  GITHUB_TOKEN: SAM_GITHUB_TOKEN
  LINEAR_API_KEY: LINEAR_API_KEY
